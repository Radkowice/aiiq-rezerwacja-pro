<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Wniosek o anulowanie rezerwacji — Rezerwia</title>
  <style>
    body{margin:0;padding:24px;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f3f6f9;color:#102c42}
    main{max-width:540px;margin:40px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 40px #102c421c}
    p{line-height:1.55}button{background:#1d4ed8;border:0;color:white;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}small{color:#526c80}
  </style>
  <script src="/assets/js/anuluj-rezerwacje.js" defer></script>
</head>
<body>
<main>
  <h1>Wniosek o anulowanie rezerwacji</h1>
  <p id="bookingInfo" aria-live="polite">Odczytywanie terminu…</p>
  <p><strong>Uwaga:</strong> wysłanie prośby nie powoduje automatycznego anulowania rezerwacji ani zwrotu płatności.</p>
  <button type="button" id="submitCancellationRequest" disabled>Wyślij prośbę o anulowanie</button>
  <p id="requestStatus" role="status" aria-live="polite"></p>
  <small>Jeżeli termin jest pilny, skontaktuj się bezpośrednio z firmą.</small>
</main>
</body>
</html>
