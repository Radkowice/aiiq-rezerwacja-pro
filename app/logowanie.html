<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Logowanie</title>
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/login-security.css?v=1">
  <link rel="stylesheet" href="/assets/css/app-footer.css">
</head>

<body>

<div class="login-page">

  <div class="login-header">
    <h2>AI-IQ Kalendarz Rezerwacji</h2>
    <p>Panel logowania administratora</p>
  </div>

  <div class="box login-box">
    <h2>Logowanie</h2>

    <div class="login-method-switch" role="group" aria-label="Wybierz metodę logowania">
      <button type="button" class="login-method-btn is-active" data-login-method="code" aria-pressed="true">
        Zaloguj się kodem
      </button>
      <button type="button" class="login-method-btn" data-login-method="password" aria-pressed="false">
        Zaloguj się hasłem
      </button>
    </div>

    <form id="loginForm" novalidate>
      <label class="login-field" for="email">
        <span>Adres e-mail</span>
        <input type="email" id="email" autocomplete="username" required>
      </label>

      <section class="login-method-panel" data-login-panel="code">
        <p class="login-method-description">
          Wyślemy jednorazowy kod na adres przypisany do aktywnego konta.
        </p>

        <div id="loginCodeStep" hidden>
          <label class="login-field" for="loginCode">
            <span>Kod logowania</span>
            <input
              type="text"
              id="loginCode"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="[0-9]{6}"
            >
          </label>

          <label class="login-trusted-option" for="trustDevice">
            <input type="checkbox" id="trustDevice" checked>
            <span>Zaufaj tej przeglądarce na ograniczony czas i umożliw logowanie hasłem.</span>
          </label>

          <button type="button" class="login-secondary-btn" id="requestNewCodeBtn">
            Wyślij nowy kod
          </button>
        </div>
      </section>

      <section class="login-method-panel" data-login-panel="password" hidden>
        <p class="login-method-description">
          Logowanie hasłem działa tylko w przeglądarce zaufanej wcześniej po zalogowaniu kodem.
        </p>
      <label class="login-field" for="password">
        <span>Hasło</span>
      </label>
      <div class="login-password-field">
        <input type="password" id="password" placeholder="Hasło" autocomplete="current-password">

        <button
          type="button"
          class="login-toggle-password"
          aria-label="Pokaż lub ukryj hasło"
        >
          <span class="password-eye password-eye-open">👁️</span>
          <span class="password-eye password-eye-closed">🙈</span>
        </button>
      </div>
      </section>

      <button type="submit" class="login-submit-btn" id="loginSubmitBtn">Wyślij kod</button>
    </form>

    <p class="login-reset-link">
      <a href="reset-hasla.html">Zapomniałeś hasła?</a>
    </p>

    <p class="login-reset-link" id="activationReissueWrap" hidden>
      <button type="button" class="login-submit-btn" id="activationReissueBtn">
        Wyślij ponownie link aktywacyjny
      </button>
    </p>

    <p class="error" id="err" aria-live="polite"></p>
  </div>

  <div class="login-footer app-footer" data-app-footer></div>
</div>

<script src="assets/js/login.js?v=8"></script>

  <script src="/assets/js/app-footer.js" defer></script>
</body>
</html>
